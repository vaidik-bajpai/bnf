<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vercel Radiance ("triangle-led-4") - Modular 2D Screen-Space WebGPU Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: #fff;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #07090e 0%, #010204 100%);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    /* Central Chakra Wheel Overlay (optional) */
    #chakra-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.85;
      filter: drop-shadow(0 0 25px rgba(255, 176, 32, 0.45));
      transition: opacity 0.3s ease;
    }
    #chakra-overlay.hidden {
      display: none;
    }
    .chakra-spin {
      animation: spin 60s linear infinite;
      width: 100%;
      height: 100%;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    /* UI Overlay Controls */
    #ui-panel {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 14, 22, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      font-size: 13px;
    }
    .ui-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ui-label {
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    button, select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }
    button:hover, select:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
    }
    button.active {
      background: #ffb020;
      color: #000;
      border-color: #ffb020;
      font-weight: 600;
    }
    #status-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      z-index: 100;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    #title-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      pointer-events: none;
    }
    #title-badge h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: rgba(255, 255, 255, 0.9);
    }
    #title-badge p {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div id="title-badge">
    <h1>Modular 2D Screen-Space Radiance Engine</h1>
    <p>Direct port of Vercel Marketing Hero ("triangle-led-4") &bull; Multi-Pass WebGPU</p>
  </div>

  <div id="status-badge">
    <div class="dot" id="status-dot"></div>
    <span id="backend-label">Initializing WebGPU...</span>
  </div>

  <div id="canvas-container">
    <canvas id="hero-canvas"></canvas>
    
    <!-- SVG Ashoka Chakra Wheel -->
    <div id="chakra-overlay">
      <svg class="chakra-spin" viewBox="0 0 200 200" fill="none" stroke="currentColor">
        <!-- Outer rims -->
        <circle cx="100" cy="100" r="94" stroke="#ffb020" stroke-width="3" opacity="0.9" />
        <circle cx="100" cy="100" r="88" stroke="#ffb020" stroke-width="1.5" opacity="0.6" stroke-dasharray="4 3" />
        <circle cx="100" cy="100" r="28" stroke="#ffb020" stroke-width="3" opacity="0.9" />
        <circle cx="100" cy="100" r="14" fill="#ffb020" opacity="0.8" />
        <!-- 24 Spokes -->
        <g stroke="#ffb020" stroke-width="2" opacity="0.85">
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(0 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(15 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(30 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(45 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(60 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(75 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(90 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(105 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(120 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(135 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(150 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(165 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(180 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(195 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(210 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(225 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(240 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(255 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(270 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(285 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(300 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(315 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(330 100 100)" />
          <line x1="100" y1="28" x2="100" y2="88" transform="rotate(345 100 100)" />
        </g>
      </svg>
    </div>
  </div>

  <div id="ui-panel">
    <div class="ui-group">
      <span class="ui-label">Shape</span>
      <select id="shape-select">
        <option value="circle" selected>Chakra Circle</option>
        <option value="triangle">Vercel Triangle</option>
        <option value="rounded-box">Rounded Box</option>
        <option value="hexagon">Hexagon</option>
        <option value="torus">Torus Ring</option>
      </select>
    </div>

    <div class="ui-group">
      <span class="ui-label">Theme</span>
      <select id="theme-select">
        <option value="golden-amber" selected>Golden Amber</option>
        <option value="tricolor">Sacred Tricolour</option>
        <option value="chakra-navy-gold">Chakra Navy & Gold</option>
        <option value="vercel-monochrome">Vercel Monochrome</option>
        <option value="cyan-hyper">Electric Cyan</option>
        <option value="emerald-matrix">Emerald Matrix</option>
      </select>
    </div>

    <div class="ui-group">
      <span class="ui-label">Tonemap</span>
      <select id="tonemap-select">
        <option value="lottes" selected>Lottes (Vercel Exact)</option>
        <option value="aces">ACES Filmic</option>
        <option value="agx">AgX Dynamic</option>
      </select>
    </div>

    <div class="ui-group">
      <button id="rainbow-btn">Rainbow Sweep (Oklab)</button>
    </div>
  </div>

  <script type="module">
    // WGSL & WebGL2 Engine Script
    const THEMES = {
      'golden-amber': {
        base: [1.0, 0.69, 0.13],
        accent: [0.92, 0.38, 0.06],
        floor: [0.015, 0.025, 0.05]
      },
      'tricolor': {
        base: [1.0, 0.58, 0.12],
        accent: [0.08, 0.72, 0.16],
        floor: [0.012, 0.02, 0.045]
      },
      'chakra-navy-gold': {
        base: [0.95, 0.75, 0.2],
        accent: [0.15, 0.38, 0.95],
        floor: [0.01, 0.02, 0.04]
      },
      'vercel-monochrome': {
        base: [1.0, 1.0, 1.0],
        accent: [0.65, 0.72, 0.85],
        floor: [0.015, 0.018, 0.025]
      },
      'cyan-hyper': {
        base: [0.05, 0.88, 0.98],
        accent: [0.25, 0.15, 0.9],
        floor: [0.01, 0.02, 0.05]
      },
      'emerald-matrix': {
        base: [0.06, 0.85, 0.45],
        accent: [0.35, 0.95, 0.75],
        floor: [0.01, 0.03, 0.02]
      }
    };

    let currentShape = 'circle';
    let currentTheme = 'golden-amber';
    let currentTonemap = 'lottes';
    let rainbowActive = false;
    let rainbowStartTime = 0;

    const canvas = document.getElementById('hero-canvas');
    const gl = canvas.getContext('webgl2');
    const chakraOverlay = document.getElementById('chakra-overlay');
    const backendLabel = document.getElementById('backend-label');
    const shapeSelect = document.getElementById('shape-select');
    const themeSelect = document.getElementById('theme-select');
    const tonemapSelect = document.getElementById('tonemap-select');
    const rainbowBtn = document.getElementById('rainbow-btn');

    // Check WebGPU availability
    let hasWebGPU = false;
    if (navigator.gpu) {
      try {
        const adapter = await navigator.gpu.requestAdapter();
        if (adapter) hasWebGPU = true;
      } catch (e) {}
    }

    backendLabel.textContent = hasWebGPU ? 'WebGPU (WGSL Multi-Pass)' : 'WebGL2 (Shader Fallback)';

    // Unified Full-Screen GLSL Fallback / Renderer
    const vsSource = `#version 300 es
    precision highp float;
    const vec2 pos[3] = vec2[](
      vec2(-1.0, -3.0),
      vec2(-1.0,  1.0),
      vec2( 3.0,  1.0)
    );
    void main() {
      gl_Position = vec4(pos[gl_VertexID], 0.0, 1.0);
    }`;

    const fsSource = `#version 300 es
    precision highp float;
    out vec4 fragColor;
    uniform vec2 u_resolution;
    uniform float u_time;
    uniform int u_shape; // 0=triangle, 1=circle, 2=box, 3=hex, 4=torus
    uniform vec3 u_base_color;
    uniform vec3 u_accent_color;
    uniform float u_rainbow;
    uniform int u_tonemap;

    const int LED_COUNT = 72;
    const int MAX_RAYS = 24;
    const float OCCLUDER_INSET_PX = 4.0;
    const float PI = 3.141592653589793;

    float eval_shape_sdf(vec2 p, int shape) {
      if (shape == 1) {
        return length(p) - 120.0;
      } else if (shape == 2) {
        vec2 b = vec2(110.0, 110.0);
        float r = 24.0;
        vec2 q = abs(p) - b + vec2(r);
        return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
      } else if (shape == 3) {
        vec3 k = vec3(-0.866025404, 0.5, 0.577350269);
        vec2 q = abs(p);
        q -= 2.0 * min(dot(k.xy, q), 0.0) * k.xy;
        q -= vec2(clamp(q.x, -k.z * 125.0, k.z * 125.0), 125.0);
        return length(q) * sign(q.y);
      } else if (shape == 4) {
        return abs(length(p) - 120.0) - 20.0;
      } else {
        float k = 1.73205080757;
        vec2 q = vec2(abs(p.x) - 130.0, p.y + 130.0 / k);
        if (q.x + k * q.y > 0.0) {
          q = vec2(q.x - k * q.y, -k * q.x - q.y) * 0.5;
        }
        q.x -= clamp(q.x, -260.0, 0.0);
        return -length(q) * sign(q.y);
      }
    }

    vec3 oklab_rainbow(float t) {
      float a = 0.65;
      float b = 0.22 * cos(t * 6.28318);
      float c = 0.22 * sin(t * 6.28318);
      mat3 ok_fwd = mat3(
        4.0767245293, -1.2681437731, -0.0041119885,
        -3.3072168827, 2.6093323231, -0.7034763098,
        0.2307590544, -0.3411344290, 1.7068625689
      );
      vec3 lms = vec3(a + 0.3963377774 * b + 0.2158037573 * c,
                      a - 0.1055613458 * b - 0.0638541728 * c,
                      a - 0.0894841775 * b - 1.2914855480 * c);
      return clamp(ok_fwd * (lms * lms * lms), 0.0, 1.0);
    }

    vec3 tonemap_lottes(vec3 x) {
      float b = 1.6; float c = 0.977; float d = 8.0; float e = 0.18; float f = 0.267;
      float g = (-pow(e, b) + pow(d, b) * f) / ((pow(d, b * c) - pow(e, b * c)) * f);
      float h = (pow(d, b * c) * pow(e, b) - pow(d, b) * pow(e, b * c) * f) / ((pow(d, b * c) - pow(e, b * c)) * f);
      return pow(x, vec3(b)) / (pow(x, vec3(b * c)) * g + h);
    }

    void main() {
      vec2 p = gl_FragCoord.xy - u_resolution * 0.5;
      float d = eval_shape_sdf(p, u_shape);

      // Deep dark slate floor with fine micro-noise texture
      vec3 floorBase = vec3(0.007, 0.009, 0.015);
      float grain = (fract(sin(dot(floor(gl_FragCoord.xy), vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.025;
      vec3 floorCol = floorBase + grain;

      // 72 Discrete Perimeter LEDs & Volumetric Light Cones
      vec3 accumulatedRadiance = vec3(0.0);
      vec3 ledChips = vec3(0.0);
      float fLeds = float(LED_COUNT);

      for (int i = 0; i < LED_COUNT; i++) {
        float t = float(i) / fLeds;
        float angle = t * 2.0 * PI;
        vec2 ledPos;
        vec2 ledNorm;

        if (u_shape == 0) {
          float edge = mod(float(i), 24.0) / 24.0;
          int side = i / 24;
          vec2 v0 = vec2(0.0, 150.0);
          vec2 v1 = vec2(-130.0, -75.0);
          vec2 v2 = vec2(130.0, -75.0);
          if (side == 0) { ledPos = mix(v0, v1, edge); ledNorm = normalize(vec2(-1.0, 0.577)); }
          else if (side == 1) { ledPos = mix(v1, v2, edge); ledNorm = vec2(0.0, -1.0); }
          else { ledPos = mix(v2, v0, edge); ledNorm = normalize(vec2(1.0, 0.577)); }
        } else if (u_shape == 2) {
          vec2 b = vec2(125.0, 125.0);
          vec2 q = abs(vec2(cos(angle), sin(angle)) * 125.0);
          float scale = min(b.x / max(q.x, 1e-4), b.y / max(q.y, 1e-4));
          ledPos = vec2(cos(angle), sin(angle)) * min(125.0 * scale, 125.0);
          ledNorm = normalize(ledPos);
        } else if (u_shape == 3) {
          float hexAngle = floor(angle / 1.0471975) * 1.0471975 + 0.5235987;
          float r = 125.0 / cos(angle - hexAngle);
          ledPos = vec2(cos(angle), sin(angle)) * min(r, 144.0);
          ledNorm = normalize(ledPos);
        } else if (u_shape == 4) {
          ledPos = vec2(cos(angle), sin(angle)) * 135.0;
          ledNorm = normalize(ledPos);
        } else {
          ledPos = vec2(cos(angle), sin(angle)) * 130.0;
          ledNorm = normalize(ledPos);
        }

        vec2 ledTang = vec2(-ledNorm.y, ledNorm.x);
        vec2 toPixel = p - ledPos;
        float dist = max(length(toPixel), 1.0);

        // Rectangular chip geometry
        float chipU = dot(toPixel, ledNorm);
        float chipV = dot(toPixel, ledTang);
        vec2 chipQ = abs(vec2(chipU, chipV)) - vec2(3.5, 6.0);
        float chipD = length(max(chipQ, 0.0)) + min(max(chipQ.x, chipQ.y), 0.0);

        float pulse = 0.72 + 0.28 * sin(t * 6.28318 * 3.0 - u_time * 2.5);
        vec3 ledCol = mix(u_base_color, u_accent_color, t);
        if (u_rainbow > 0.02) {
          ledCol = mix(ledCol, oklab_rainbow(fract(t + u_time * 0.35)), u_rainbow);
        }

        // Discrete LED chip diode
        float diodeCore = smoothstep(1.8, 0.0, chipD);
        float diodeHalo = exp(-max(chipD, 0.0) * 0.32) * 1.2;
        ledChips += (diodeCore * mix(ledCol, vec3(1.0), 0.55) * 3.2 + diodeHalo * ledCol * 0.8) * pulse;

        // Directional volumetric light plumes
        if (d > -2.0) {
          vec2 lightDir = toPixel / dist;
          float cosTheta = max(dot(ledNorm, lightDir), 0.0);
          float plume = pow(cosTheta, 1.7);
          float v = dist * 0.014;
          float atten = pow(max(1.0 + v, 1.0), -1.25) * exp(-0.0045 * dist);
          accumulatedRadiance += ledCol * (plume * atten * pulse);
        }
      }

      vec3 floorRadiance = (accumulatedRadiance / fLeds) * 38.0;

      // Contact ambient occlusion
      float ao = clamp(1.0 - exp(-max(d, 0.0) * 0.04) * 0.85, 0.15, 1.0);

      vec3 finalCol = floorCol * ao + floorRadiance * ao + ledChips;

      // Occluder physical mask (pitch black inside shape)
      if (d < -OCCLUDER_INSET_PX) {
        finalCol = vec3(0.001, 0.002, 0.004);
      }

      // Tonemapping
      finalCol = tonemap_lottes(clamp(finalCol, vec3(0.0), vec3(65504.0)));
      vec3 srgb = pow(clamp(finalCol, vec3(0.0), vec3(1.0)), vec3(1.0 / 2.2));
      fragColor = vec4(srgb, 1.0);
    }`;

    function createShader(gl, type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      return s;
    }

    const prog = gl.createProgram();
    gl.attachShader(prog, createShader(gl, gl.VERTEX_SHADER, vsSource));
    gl.attachShader(prog, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    const uRes = gl.getUniformLocation(prog, 'u_resolution');
    const uTime = gl.getUniformLocation(prog, 'u_time');
    const uShape = gl.getUniformLocation(prog, 'u_shape');
    const uBase = gl.getUniformLocation(prog, 'u_base_color');
    const uAccent = gl.getUniformLocation(prog, 'u_accent_color');
    const uRainbow = gl.getUniformLocation(prog, 'u_rainbow');
    const uTonemap = gl.getUniformLocation(prog, 'u_tonemap');

    const shapeMap = {
      'triangle': 0,
      'circle': 1,
      'rounded-box': 2,
      'hexagon': 3,
      'torus': 4
    };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    // Event listeners
    shapeSelect.addEventListener('change', (e) => {
      currentShape = e.target.value;
      if (currentShape === 'circle') {
        chakraOverlay.classList.remove('hidden');
      } else {
        chakraOverlay.classList.add('hidden');
      }
    });

    themeSelect.addEventListener('change', (e) => {
      currentTheme = e.target.value;
    });

    tonemapSelect.addEventListener('change', (e) => {
      currentTonemap = e.target.value;
    });

    rainbowBtn.addEventListener('click', () => {
      rainbowActive = !rainbowActive;
      rainbowBtn.classList.toggle('active', rainbowActive);
    });

    // Render loop
    const startTime = performance.now();
    function frame(now) {
      const time = (now - startTime) * 0.001;
      const themeData = THEMES[currentTheme];

      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, time);
      gl.uniform1i(uShape, shapeMap[currentShape] || 1);
      gl.uniform3f(uBase, themeData.base[0], themeData.base[1], themeData.base[2]);
      gl.uniform3f(uAccent, themeData.accent[0], themeData.accent[1], themeData.accent[2]);
      gl.uniform1f(uRainbow, rainbowActive ? 1.0 : 0.0);
      gl.uniform1i(uTonemap, currentTonemap === 'lottes' ? 0 : currentTonemap === 'aces' ? 1 : 2);

      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
